# The customer's deployment repository for the vendor's application (dotnet-vendor).
# The vendor delivers container images; this repository decides which version runs in staging and production, as
# Podman Quadlet files. Changes arrive as merge requests that the code owner must approve (.gitlab/CODEOWNERS).
#   validate    merge requests and main: the Quadlet files are checked with Podman's generator
#   staging     main: copy the Quadlet file to the server, restart the unit                          (automatic)
#   production  main: the same                                                                       (manual, protected environment)

include:
  - project: examples/ci-templates
    ref: main
    file: /rocky.yml

stages: [validate, staging, production]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

variables:
  # The pipelines log in as the rootless Podman account (it owns the user systemd instance that runs the units)
  SSH_USER: svc-dotnet

validate:
  stage: validate
  image: rockylinux/rockylinux:10
  before_script:
    - !reference [.rocky-dnf, before_script]
    - dnf -y -q install podman
  script:
    - scripts/validate.sh

.deploy:
  image: rockylinux/rockylinux:10
  needs: [validate]
  resource_group: dotnet-vendor-$DEPLOY_ENV
  before_script:
    - !reference [.rocky-dnf, before_script]
    - dnf -y -q install openssh-clients curl
    - !reference [.ssh-setup, before_script]
  script:
    - scripts/deploy.sh $DEPLOY_ENV

deploy:staging:
  extends: .deploy
  stage: staging
  variables:
    DEPLOY_ENV: staging
  environment:
    name: staging
    url: https://dotnet-vendor-staging.$EXAMPLES_DOMAIN
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:production:
  extends: .deploy
  stage: production
  needs: [validate, deploy:staging]
  variables:
    DEPLOY_ENV: production
  environment:
    name: production
    url: https://dotnet-vendor-production.$EXAMPLES_DOMAIN
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
